name: WorkHub
options:
  bundleIdPrefix: me.buongloi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  WorkHub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Work Hub"
        CFBundleIdentifier: "me.buongloi.workhub"
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: "Work Hub cần quyền Camera để chụp ảnh biên bản giao việc, bảng phân ca và tài liệu cho AI phân tích."
        NSMicrophoneUsageDescription: "Work Hub cần quyền Microphone để ghi âm giọng nói tiếng Việt chuyển thành công việc tự động."
        NSSpeechRecognitionUsageDescription: "Work Hub sử dụng nhận diện giọng nói để thêm việc nhanh không cần gõ phím."
        NSPhotoLibraryUsageDescription: "Work Hub cần quyền Thư viện ảnh để tải ảnh lên cho AI phân tích."
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: "me.buongloi.workhub.aiscan"
            UIApplicationShortcutItemTitle: "Quét Ảnh & Giọng Nói AI"
            UIApplicationShortcutItemSubtitle: "Tạo việc từ Camera hoặc Mic"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeCapturePhoto"
          - UIApplicationShortcutItemType: "me.buongloi.workhub.focus"
            UIApplicationShortcutItemTitle: "Focus & Nhạc Lofi"
            UIApplicationShortcutItemSubtitle: "Đồng hồ Pomodoro tập trung"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeTime"
          - UIApplicationShortcutItemType: "me.buongloi.workhub.kanban"
            UIApplicationShortcutItemTitle: "Bảng Kanban"
            UIApplicationShortcutItemSubtitle: "Xem tiến độ kéo thả"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeTaskCompleted"
          - UIApplicationShortcutItemType: "me.buongloi.workhub.scratchpad"
            UIApplicationShortcutItemTitle: "Nháp Nhanh"
            UIApplicationShortcutItemSubtitle: "Ghi nhanh ý tưởng tức thì"
            UIApplicationShortcutItemIconType: "UIApplicationShortcutIconTypeCompose"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
